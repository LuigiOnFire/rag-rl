program: oracle_kd/train_router.py
project: thrifty-rag-router
name: router_bucket_sweep
method: bayes
metric:
  name: eval/loss
  goal: minimize
parameters:
  learning_rate:
    distribution: log_uniform_values
    min: 1e-6
    max: 5e-4
  batch_size:
    values: [8, 16, 32]
  weight_decay:
    values: [0.0, 0.01, 0.1]
  warmup_ratio:
    values: [0.0, 0.1, 0.2]
  lr_scheduler_type:
    values: [linear, cosine, cosine_with_restarts]
  hidden_dropout_prob:
    distribution: uniform
    min: 0.0
    max: 0.3
  attention_probs_dropout_prob:
    distribution: uniform
    min: 0.0
    max: 0.3
command:
  - ${env}
  - .venv/bin/python
  - ${program}
  - "--routing-strategy"
  - "bucket"
  - ${args}
