program: scripts/05_train_grpo.py
method: bayes
metric:
  name: accuracy/stability_score
  goal: maximize
parameters:
  learning_rate:
    distribution: log_uniform_values
    min: 2e-6
    max: 5e-5
  kl_coef:
    distribution: uniform
    min: 0.008
    max: 0.02
  clip_eps:
    value: 0.2
  adam_beta1:
    value: 0.9
  joule_penalty_scale:
    distribution: uniform
    min: 0.005
    max: 0.1
  max_joule_penalty:
    distribution: uniform
    min: 0.05
    max: 0.5
command:
  - ${env}
  - .venv/bin/python
  - ${program}
  - ${args}
